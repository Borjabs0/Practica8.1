services:

  # ── HADOOP ──────────────────────────────────────────
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    ports:
      - "9870:9870"   # Web UI HDFS
      - "9000:9000"
    environment:
      - CLUSTER_NAME=practica8
    env_file:
      - ./hadoop.env
    volumes:
      - hadoop_namenode:/hadoop/dfs/name

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode
    depends_on:
      - namenode
    env_file:
      - ./hadoop.env
    volumes:
      - hadoop_datanode:/hadoop/dfs/data
  hive-postgres:
    image: postgres:11
    container_name: hive-postgres
    environment:
      POSTGRES_DB: metastore
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive
    volumes:
      - hive_postgres_data:/var/lib/postgresql/data

  # ── HIVE ────────────────────────────────────────────
  hive-metastore:
    image: bde2020/hive:2.3.2-postgresql-metastore
    container_name: hive-metastore
    depends_on:
      - namenode
      - datanode
    env_file:
      - ./hadoop.env
    command: /opt/hive/bin/hive --service metastore

  hive-server:
    image: bde2020/hive:2.3.2-postgresql-metastore
    container_name: hive-server
    depends_on:
      - hive-metastore
    env_file:
      - ./hadoop.env
    ports:
      - "10001:10000"  # HiveServer2
      - "10002:10002"  # Web UI Hive
    volumes:
      - ./data:/data   # aquí dejaremos los CSVs

  # ── PROMETHEUS ──────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  # ── NODE EXPORTER (simula nodos del clúster) ────────
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    ports:
      - "9100:9100"

  hue:
    image: gethue/hue:latest
    container_name: hue
    ports:
       - "8888:8888"
    depends_on:
       - hive-server
    volumes:
       - ./hue.ini:/usr/share/hue/desktop/conf/z-hue.ini
  

volumes:
  hadoop_namenode:
  hadoop_datanode:
  hive_postgres_data: